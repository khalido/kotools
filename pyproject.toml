[project]
name = "kotools"
version = "2026.7.27"
description = "Ko's personal opinionated CLI — thin wrappers around SDKs I use often, built so both I and AI agents can lean on it."
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ko", email = "khalid.omar@gmail.com" }]
keywords = ["cli", "research", "arxiv", "hacker-news", "llm", "agents", "cloudflare"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.15",
    "Topic :: Utilities",
]
dependencies = [
    "arxiv>=4.0.0",
    "arxiv2markdown>=0.1.0",
    "exa-py>=2.16.2",  # search(contents=…) API; 2.14/2.15 lack it
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.28.1",  # stays: exa-py/arxiv2markdown/mcp/google-genai pin it; we don't import it
    "httpx2>=2.12,<3",  # our own HTTP (`import httpx2 as httpx`) — pydantic's kept-API fork; OS trust store, not certifi (see WORKLOG 2026-08-31)
    "liteparse>=2.15",  # page_label, image_mode="none", is_complex (ko doc)
    "loguru~=0.7.3",
    "markdown-it-py>=4.2.0",  # gmail draft --md: markdown -> html (also arrives transitively via rich)
    # <2 deliberately: mcp 2.0 drops `mcp.client.streamable_http.streamablehttp_client`,
    # which ticktick.py + mcp_client.py import. Lift the cap only with that port.
    "mcp[cli]>=1.29.0,<2",
    "mdit-py-plugins>=0.6.1",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    # floor at 2.21: without it uv maximizes fastmcp-slim into a 4.x prerelease and pins
    # pydantic-ai back to 2.4 (2.21 caps fastmcp-slim<4, older versions don't cap at all).
    "pydantic-ai-slim[google,openrouter,mcp,typesafe]>=2.56,<3",
    "pygments>=2.20.0",
    "python-docx>=1.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "rich>=15.0.0",  # direct import in agents/_shared.py; don't rely on typer's transitive extra
    "trafilatura>=2.1.0",
    "typer>=0.27.0",
    "tzdata>=2026.3",  # guarantees zoneinfo works cross-platform (ko cal)
    "weasyprint>=69.0",
    "xdk>=0.10.6",
    "youtube-transcript-api>=1.2.4",
]

[project.urls]
Homepage = "https://github.com/khalido/kotools"
Documentation = "https://kotools.khalido.dev"
Repository = "https://github.com/khalido/kotools"
Changelog = "https://github.com/khalido/kotools/blob/main/CHANGELOG.md"
Issues = "https://github.com/khalido/kotools/issues"

[project.scripts]
ko = "ko.cli:main"
kotools = "ko.cli:main"  # install-name alias; `ko` stays the daily command

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
# On ruff's (0.16+) defaults, minus the rules that fight deliberate patterns here:
#  B008  — typer.Option/Argument in defaults IS the Typer idiom
#  BLE001 — blind `except Exception` is the resilient-agent-tool design (one flaky
#           source degrades to a note, never aborts a run)
#  S110  — try/except/pass in best-effort paths (logging, telemetry) that must
#          never break a command
ignore = ["B008", "BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
# Test fakes use bare class attributes (RUF012) and local-time asserts (DTZ005) freely.
"tests/**" = ["RUF012", "DTZ005"]

[tool.hatch.build.targets.wheel]
packages = ["src/ko"]

[tool.hatch.build.targets.sdist]
# Keep node/IDE tooling out of the source distribution — wrangler is dev-only
# (a pip-installed user falls back to `npx wrangler@4`).
exclude = [".claude", "node_modules", "package.json", "package-lock.json"]

[dependency-groups]
dev = [
    "pydantic-ai-harness[codemode]>=0.23.0",
    "pytest>=9.1.1",
    "ruff>=0.16",  # formatter output is version-sensitive; an older ruff would rewrap the repo
]
