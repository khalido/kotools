name: install-check

# `uv tool install` ignores uv.lock, so a release can break months later when a dependency moves.
on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uvx --from kotools ko --version
