name: publish

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC — PyPI trusted publishing, no tokens
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build --no-sources
      # Installs the wheel the way a user would, away from the project and its lock.
      - run: uv run --isolated --no-project --with dist/*.whl ko --version
      - run: uv publish
